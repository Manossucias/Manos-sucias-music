<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MANOS SUCIAS — Escuchar es oficio</title>
  <link
    id="faviconLink"
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 1000'%3E%3Crect width='1000' height='1000' fill='%2323150C'/%3E%3Ctext x='500' y='455' text-anchor='middle' fill='%23EFE4BE' font-family='Georgia, serif' font-weight='800' font-size='215'%3EMANOS%3C/text%3E%3Ctext x='500' y='725' text-anchor='middle' fill='%23EFE4BE' font-family='Georgia, serif' font-weight='800' font-size='215'%3ESUCIAS%3C/text%3E%3C/svg%3E"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    /* =========================================================================
       PALETA MANOS SUCIAS: CAFÉ OSCURO, CREMA CÁLIDO Y NARANJA RETRO
       ========================================================================= */
    :root {
      --bg-base: #23150C;
      --bg-deep: #160D07;
      --surface-1: #311E12;
      --surface-2: #3D2617;
      --cream: #EFE4BE;
      --cream-muted: #D8C99B;
      --accent: #E06D2B;
      --accent-hover: #EB7B3A;
      --border-subtle: rgba(239, 228, 190, 0.2);
      --border-strong: rgba(239, 228, 190, 0.48);
      --font-logo: 'Fredoka', 'Syne', Georgia, serif;
      --font-display: 'Syne', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'Space Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --shadow-card: 0 14px 30px rgba(10, 5, 2, 0.52);
      --shadow-hover: 0 22px 40px rgba(10, 5, 2, 0.76);
      --shadow-btn: 3px 3px 0px #EFE4BE;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(rgba(239, 228, 190, 0.045) 1px, transparent 0),
        radial-gradient(circle at 88% 8%, rgba(224, 109, 43, 0.14), transparent 36%),
        linear-gradient(180deg, rgba(22, 13, 7, 0.85) 0%, rgba(35, 21, 12, 0.98) 380px);
      background-size: 24px 24px, 100% 100%, 100% 100%;
      color: var(--cream);
      font-family: var(--font-sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, .font-display {
      font-family: var(--font-display);
      letter-spacing: -0.015em;
    }

    .font-logo {
      font-family: var(--font-logo);
    }

    .font-mono {
      font-family: var(--font-mono);
    }

    .container {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding-left: 1rem;
      padding-right: 1rem;
    }

    @media (min-width: 640px) {
      .container {
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }
    }

    /* =========================================================================
       ENCABEZADO Y NAVEGACIÓN
       ========================================================================= */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(22, 13, 7, 0.93);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-subtle);
    }

    .header-inner {
      min-height: 78px;
      padding: 0.7rem 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
    }

    .brand-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      color: var(--cream);
      text-align: left;
    }

    .brand-text-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .brand-name {
      font-family: var(--font-logo);
      font-weight: 700;
      font-size: clamp(1.2rem, 2.4vw, 1.55rem);
      line-height: 1.05;
      color: var(--cream);
      letter-spacing: 0.02em;
    }

    .brand-slogan {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      color: var(--cream-muted);
      margin-top: 0.12rem;
    }

    .nav-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.56rem 0.92rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface-1);
      color: var(--cream);
      font-family: var(--font-sans);
      font-size: 0.84rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      box-shadow: var(--shadow-btn);
      transition: transform 0.14s ease, background-color 0.16s ease, box-shadow 0.14s ease, border-color 0.16s ease;
    }

    .btn:hover {
      background: var(--surface-2);
      transform: translate(-1px, -1px);
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--cream);
    }

    .btn-accent {
      background: var(--accent);
      color: var(--bg-deep);
      border-color: var(--accent);
      font-weight: 700;
      box-shadow: 3px 3px 0px var(--cream);
    }

    .btn-accent:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      color: var(--bg-deep);
    }

    .btn-active {
      background: var(--cream);
      color: var(--bg-base);
      border-color: var(--cream);
      font-weight: 700;
    }

    .btn-active:hover {
      background: #E5D7AA;
      color: var(--bg-base);
    }

    .badge-count {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.12rem 0.5rem;
      border-radius: 999px;
      background: var(--bg-deep);
      color: var(--cream);
      border: 1px solid var(--border-subtle);
    }

    .btn-active .badge-count {
      background: var(--bg-base);
      color: var(--cream);
    }

    /* =========================================================================
       CATÁLOGO PRINCIPAL
       ========================================================================= */
    .main-wrap {
      flex: 1;
      padding: 2rem 0 3.5rem;
    }

    .catalog-top {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.35rem;
    }

    .kicker {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      font-weight: 700;
      display: block;
    }

    .catalog-title {
      margin: 0.25rem 0 0;
      font-size: clamp(1.9rem, 4vw, 2.55rem);
      font-weight: 800;
      color: var(--cream);
    }

    .catalog-stats {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
    }

    .controls-box {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.15rem;
      box-shadow: var(--shadow-card);
      margin-bottom: 1.85rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    @media (min-width: 768px) {
      .controls-box {
        grid-template-columns: 1.6fr 1fr auto;
        align-items: end;
        padding: 1.3rem;
      }
    }

    .field-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--cream-muted);
      margin-bottom: 0.4rem;
    }

    .input-box,
    .select-box,
    .textarea-box {
      width: 100%;
      padding: 0.62rem 0.82rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--bg-deep);
      color: var(--cream);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.16s ease;
    }

    .input-box:focus,
    .select-box:focus,
    .textarea-box:focus {
      border-color: var(--accent);
    }

    .input-box::placeholder,
    .textarea-box::placeholder {
      color: rgba(216, 201, 155, 0.48);
    }

    /* =========================================================================
       GRID Y TARJETAS DE DISCOS
       ========================================================================= */
    .records-grid {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 1.45rem;
    }

    @media (min-width: 580px) {
      .records-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 920px) {
      .records-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (min-width: 1200px) {
      .records-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .record-card {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.24s ease, border-color 0.24s ease;
    }

    .record-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-hover);
      border-color: var(--accent);
    }

    .cover-wrap {
      position: relative;
      aspect-ratio: 1 / 1;
      width: 100%;
      background: var(--bg-deep);
      border-bottom: 1px solid var(--border-subtle);
      overflow: hidden;
      cursor: pointer;
    }

    .cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.36s ease;
    }

    .record-card:hover .cover-wrap img {
      transform: scale(1.035);
    }

    .featured-chip {
      position: absolute;
      top: 0.7rem;
      left: 0.7rem;
      z-index: 3;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.22rem 0.58rem;
      border-radius: 999px;
      background: var(--accent);
      color: var(--bg-deep);
      border: 1px solid var(--bg-deep);
    }

    .fav-icon-btn {
      position: absolute;
      top: 0.7rem;
      right: 0.7rem;
      z-index: 3;
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: rgba(22, 13, 7, 0.88);
      color: var(--cream);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease, color 0.15s ease;
    }

    .fav-icon-btn:hover {
      transform: scale(1.07);
      background: var(--surface-2);
    }

    .fav-icon-btn.is-fav {
      color: var(--accent);
      border-color: var(--accent);
    }

    .card-content {
      padding: 1rem 1.05rem 1.1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      gap: 0.85rem;
    }

    .card-badges {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      margin-bottom: 0.45rem;
      flex-wrap: wrap;
    }

    .status-pill {
      font-family: var(--font-mono);
      font-size: 0.69rem;
      font-weight: 700;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
    }

    .status-Disponible {
      background: var(--cream);
      color: var(--bg-base);
      border-color: var(--cream);
    }

    .status-Preventa {
      background: var(--accent);
      color: var(--bg-deep);
      border-color: var(--accent);
    }

    .status-Agotado {
      background: var(--bg-deep);
      color: var(--cream-muted);
      border-color: rgba(239, 228, 190, 0.22);
    }

    .card-year {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--cream-muted);
    }

    .card-title {
      margin: 0;
      font-size: 1.06rem;
      font-weight: 800;
      color: var(--cream);
      line-height: 1.25;
      cursor: pointer;
    }

    .card-title:hover {
      color: var(--accent);
    }

    .card-artist {
      margin: 0.22rem 0 0;
      font-size: 0.88rem;
      color: var(--cream-muted);
      font-weight: 500;
    }

    .card-genre {
      margin: 0.32rem 0 0;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--accent);
    }

    .card-bottom {
      border-top: 1px solid var(--border-subtle);
      padding-top: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .price-label {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--cream);
    }

    .price-consult {
      color: var(--cream-muted);
      font-size: 0.82rem;
      font-style: italic;
    }

    .empty-box {
      text-align: center;
      padding: 3.5rem 1.5rem;
      border-radius: var(--radius-lg);
      background: var(--surface-1);
      border: 1px dashed var(--border-strong);
      margin-top: 1rem;
    }

    /* =========================================================================
       MODALES (FICHA DE DISCO Y ADMINISTRACIÓN)
       ========================================================================= */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: flex-start;
      justify-content: center;
      background: rgba(12, 7, 3, 0.85);
      backdrop-filter: blur(5px);
      padding: 1.25rem 0.75rem;
      overflow-y: auto;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-panel {
      position: relative;
      width: 100%;
      background: var(--bg-base);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-hover);
      margin: auto;
      overflow: hidden;
    }

    .modal-detail-panel {
      max-width: 940px;
    }

    .modal-admin-panel {
      max-width: 1200px;
    }

    .close-btn {
      position: absolute;
      top: 0.9rem;
      right: 0.9rem;
      z-index: 10;
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--surface-1);
      color: var(--cream);
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover {
      background: var(--accent);
      color: var(--bg-deep);
      border-color: var(--accent);
    }

    .detail-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      padding: 1.5rem;
    }

    @media (min-width: 768px) {
      .detail-layout {
        grid-template-columns: 5fr 7fr;
        padding: 2rem;
        gap: 2rem;
      }
    }

    .detail-cover {
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border-strong);
      background: var(--bg-deep);
    }

    .detail-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .meta-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: center;
    }

    .info-chip {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      padding: 0.22rem 0.6rem;
      border-radius: 999px;
      background: var(--surface-1);
      color: var(--cream);
      border: 1px solid var(--border-subtle);
    }

    .price-strip {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0.8rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .soldout-alert {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      border: 1px solid var(--accent);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--cream);
    }

    .tracklist-card {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0.85rem 1rem;
    }

    .tracklist-card ol {
      margin: 0;
      padding-left: 1.25rem;
      display: grid;
      gap: 0.32rem;
      font-size: 0.88rem;
      color: var(--cream);
    }

    /* Administración */
    .admin-top {
      padding: 1.25rem 1.5rem;
      background: var(--bg-deep);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
      padding-right: 3.6rem;
    }

    .admin-grid {
      padding: 1.35rem 1.5rem 1.75rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 960px) {
      .admin-grid {
        grid-template-columns: 5fr 7fr;
      }
    }

    .admin-form-box {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1.2rem;
      height: fit-content;
    }

    .form-field {
      margin-bottom: 0.85rem;
    }

    .form-two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .check-inline {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.82rem;
      color: var(--cream);
      cursor: pointer;
    }

    .check-inline input[type="checkbox"] {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .admin-items {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      max-height: 700px;
      overflow-y: auto;
      padding-right: 0.25rem;
    }

    .admin-row {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.75rem 0.9rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .admin-row-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
      flex: 1 1 240px;
    }

    .admin-mini-cover {
      width: 54px;
      height: 54px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      flex-shrink: 0;
      background: var(--bg-deep);
    }

    .admin-mini-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .admin-row-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .btn-xs {
      padding: 0.36rem 0.62rem;
      font-size: 0.75rem;
      box-shadow: 2px 2px 0px var(--cream);
    }

    /* =========================================================================
       PIE DE PÁGINA Y NOTIFICACIONES
       ========================================================================= */
    .site-footer {
      background: var(--bg-deep);
      border-top: 1px solid var(--border-subtle);
      padding: 1.3rem 0;
      margin-top: auto;
      font-size: 0.83rem;
      color: var(--cream-muted);
    }

    .footer-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .toast-stack {
      position: fixed;
      bottom: 1.1rem;
      right: 1.1rem;
      z-index: 70;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-width: 340px;
      width: calc(100% - 2.2rem);
      pointer-events: none;
    }

    .toast-card {
      background: var(--bg-deep);
      color: var(--cream);
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 0.7rem 0.9rem;
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: var(--shadow-hover);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- =======================================================================
       ENCABEZADO
       ======================================================================= -->
  <header class="site-header">
    <div class="container header-inner">
      <button type="button" class="brand-btn" onclick="resetToAllCatalog()">
        <div class="brand-text-group">
          <span class="brand-name">MANOS SUCIAS</span>
          <span class="brand-slogan">Escuchar es oficio</span>
        </div>
      </button>

      <nav class="nav-group" aria-label="Navegación">
      <nav class="nav-group" aria-label="Navegación principal">

        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500"><rect width="500" height="500" fill="#23150C"/><rect x="22" y="22" width="456" height="456" rx="20" fill="none" stroke="#EFE4BE" stroke-opacity="0.28" stroke-width="2.5"/>${graphicLayer}<rect x="44" y="304" width="412" height="148" rx="14" fill="#160D07" stroke="#EFE4BE" stroke-opacity="0.3" stroke-width="2"/><text x="66" y="352" fill="#EFE4BE" font-family="Georgia, serif" font-weight="700" font-size="29">${albumText}</text><text x="66" y="388" fill="#D8C99B" font-family="monospace" font-size="20">${artistText}</text><text x="66" y="428" fill="#E06D2B" font-family="monospace" font-weight="700" font-size="15">MANOS SUCIAS · ${condText} · ${yearText}</text></svg>`;
        return svgDataUri(svg);
      }

      function getDefaultCoverForAlbum(albumTitle) {
        const key = String(albumTitle || '').trim().toLowerCase();
        if (key.includes('abba') || key.includes('gold')) return PROVIDED_COVERS.abbaGold;
        if (key.includes('debi') || key.includes('debí') || key.includes('fotos')) return PROVIDED_COVERS.debiTirarMasFotos;
        if (key.includes('floral green')) return PROVIDED_COVERS.floralGreen;
        if (key.includes('cheetah')) return PROVIDED_COVERS.liveAtTheCheetah;
        if (key.includes('lucky 7')) return PROVIDED_COVERS.lucky7;
        if (key.includes('de ti depende')) return PROVIDED_COVERS.deTiDepende;
        if (key.includes('currents')) return PROVIDED_COVERS.currents;
        if (key.includes('torches')) return PROVIDED_COVERS.torches;
        if (key.includes('this old dog')) return PROVIDED_COVERS.thisOldDog;
        if (key.includes('lp1') || key.includes('american football')) return PROVIDED_COVERS.americanFootball;
        if (key.includes('sour') || key.includes('olivia rodrigo')) return PROVIDED_COVERS.sour;
        if (key.includes('melophobia') || key.includes('cage the elephant')) return PROVIDED_COVERS.melophobia;
        if (key.includes('latin sound') || key.includes('fania records')) return PROVIDED_COVERS.faniaLatinSound;
        if (key.includes('kind of blue') || key.includes('miles davis')) return PROVIDED_COVERS.kindOfBlue;
        if (key.includes('in rainbows') || key.includes('in/rainbows') || key.includes('radiohead')) return PROVIDED_COVERS.inRainbows;
        if (key.includes('lonerism')) return PROVIDED_COVERS.lonerism;
        return '';
      }

      function getRecordCover(record) {
        if (record && typeof record.cover === 'string' && record.cover.trim() !== '') {
          return record.cover.trim();
        }
        const matched = getDefaultCoverForAlbum(record && record.album);
        if (matched) return matched;
        return buildUniqueSvgCover(record || {});
      }

      const state = {
        records: [],
        favorites: [],
        search: '',
        sort: 'default',
        favoritesOnly: false,
        uploadedCoverUrl: '',
        isAdminMode: false
      };

      function detectAdminAccess() {
        try {
          const params = new URLSearchParams(window.location.search || '');
          const hash = String(window.location.hash || '').toLowerCase();
          return params.get('admin') === '1' || params.get('admin') === 'true' || hash === '#admin';
        } catch (err) {
          return false;
        }
      }

      function applyAdminVisibility() {
        state.isAdminMode = detectAdminAccess();
        const adminBtn = document.getElementById('adminNavBtn');
        if (adminBtn) {
          adminBtn.classList.toggle('hidden', !state.isAdminMode);
        }
        if (!state.isAdminMode) {
          window.closeAdminPanel();
        }
      }

      function cloneData(arr) {
        return JSON.parse(JSON.stringify(arr));
      }

      function loadStorage() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            return { records: cloneData(BASE_CATALOG), favorites: [] };
          }
          const parsed = JSON.parse(raw);
          const records = Array.isArray(parsed.records) && parsed.records.length > 0
            ? parsed.records.map((rec) => {
                const defaultCover = getDefaultCoverForAlbum(rec.album);
                return {
                  ...rec,
                  cover: rec.cover && rec.cover.trim() !== '' ? rec.cover : defaultCover
                };
              })
            : cloneData(BASE_CATALOG);
          const favorites = Array.isArray(parsed.favorites)
            ? parsed.favorites.filter((item) => typeof item === 'string')
            : [];
          return { records, favorites };
        } catch (err) {
          return { records: cloneData(BASE_CATALOG), favorites: [] };
        }
      }

      function saveStorage() {
        try {
          window.localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({ records: state.records, favorites: state.favorites })
          );
        } catch (err) {
          console.warn('Error guardando en localStorage:', err);
        }
      }

      function formatPriceDisplay(price) {
        if (price === null || price === undefined || price === '' || Number.isNaN(Number(price))) {
          return { text: 'Precio por confirmar', isConsult: true };
        }
        const formatted = new Intl.NumberFormat('es-MX', {
          style: 'currency',
          currency: 'MXN',
          minimumFractionDigits: 2
        }).format(Number(price));
        return { text: `${formatted} MXN`, isConsult: false };
      }

      function getSortedFilteredRecords() {
        const q = state.search.trim().toLowerCase();
        const list = state.records.filter((rec) => {
          if (state.favoritesOnly && !state.favorites.includes(rec.id)) {
            return false;
          }
          if (q) {
            const tracksText = Array.isArray(rec.tracklist) ? rec.tracklist.join(' ') : '';
            const haystack = `${rec.album || ''} ${rec.artist || ''} ${rec.genre || ''} ${tracksText}`.toLowerCase();
            if (!haystack.includes(q)) return false;
          }
          return true;
        });

        list.sort((a, b) => {
          switch (state.sort) {
            case 'price-asc': {
              const pa = a.price !== null && a.price !== undefined && a.price !== '' ? Number(a.price) : Number.POSITIVE_INFINITY;
              const pb = b.price !== null && b.price !== undefined && b.price !== '' ? Number(b.price) : Number.POSITIVE_INFINITY;
              return pa - pb;
            }
            case 'price-desc': {
              const pa = a.price !== null && a.price !== undefined && a.price !== '' ? Number(a.price) : -1;
              const pb = b.price !== null && b.price !== undefined && b.price !== '' ? Number(b.price) : -1;
              return pb - pa;
            }
            case 'newest': {
              const ya = a.year ? Number(a.year) : -1;
              const yb = b.year ? Number(b.year) : -1;
              return yb - ya;
            }
            case 'popularity': {
              const fa = a.featured ? 1 : 0;
              const fb = b.featured ? 1 : 0;
              if (fb !== fa) return fb - fa;
              const ya = a.year ? Number(a.year) : -1;
              const yb = b.year ? Number(b.year) : -1;
              return yb - ya;
            }
            case 'default':
            default:
              return 0;
          }
        });

        return list;
      }

      function renderCatalogView() {
        const grid = document.getElementById('recordsGrid');
        const emptyBox = document.getElementById('emptyStateBox');
        const favBadge = document.getElementById('headerFavBadge');
        const availBadge = document.getElementById('availableCountBadge');
        const navFav = document.getElementById('navFavBtn');
        const quickFav = document.getElementById('quickFavBtn');
        const navCat = document.getElementById('navCatalogBtn');

        if (favBadge) favBadge.textContent = String(state.favorites.length);
        const availableTotal = state.records.filter((r) => r.status === 'Disponible').length;
        if (availBadge) availBadge.textContent = `${availableTotal} disponibles`;

        if (state.favoritesOnly) {
          navFav?.classList.add('btn-active');
          quickFav?.classList.add('btn-active');
          navCat?.classList.remove('btn-active');
        } else {
          navFav?.classList.remove('btn-active');
          quickFav?.classList.remove('btn-active');
          navCat?.classList.add('btn-active');
        }

        const filtered = getSortedFilteredRecords();
        if (!grid || !emptyBox) return;

        if (filtered.length === 0) {
          grid.innerHTML = '';
          emptyBox.classList.remove('hidden');
          return;
        }

        emptyBox.classList.add('hidden');
        grid.innerHTML = filtered.map((rec) => {
          const isFav = state.favorites.includes(rec.id);
          const priceInfo = formatPriceDisplay(rec.price);
          const statusClass = ['Disponible', 'Preventa', 'Agotado'].includes(rec.status)
            ? `status-${rec.status}`
            : 'status-Disponible';

          return `
            <article class="record-card">
              <div class="cover-wrap" onclick="window.openRecordModal('${rec.id}')">
                ${rec.featured ? `<span class="featured-chip">Destacado</span>` : ''}
                <button

                  class="fav-icon-btn ${isFav ? 'is-fav' : ''}"

                  onclick="event.stopPropagation(); window.toggleFav('${rec.id}')"
                >
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                  </svg>
                </button>
                <img
                  src="${getRecordCover(rec)}"
                  alt="Portada de ${escapeXml(rec.album)} — ${escapeXml(rec.artist)}"
                  loading="lazy"
                />
              </div>

              <div class="card-content">
                <div>
                  <div class="card-badges">
                    <span class="status-pill ${statusClass}">${escapeXml(rec.status || 'Disponible')}</span>
                    <span class="card-year">${rec.year ? escapeXml(String(rec.year)) : 'S/A'}</span>
                  </div>
                  <h2 class="card-title" onclick="window.openRecordModal('${rec.id}')">${escapeXml(rec.album)}</h2>
                  <p class="card-artist">${escapeXml(rec.artist)}</p>
                  ${rec.genre ? `<p class="card-genre">${escapeXml(rec.genre)}</p>` : ''}
                </div>

                <div class="card-bottom">
                  <span class="price-label ${priceInfo.isConsult ? 'price-consult' : ''}">${escapeXml(priceInfo.text)}</span>
                  <button type="button" class="btn btn-xs" style="width:100%;" onclick="window.openRecordModal('${rec.id}')">
                    Ver ficha
                  </button>
                </div>
              </div>
            </article>
          `;
        }).join('');
      }

      window.openRecordModal = function (id) {

      window.openAdminPanel = function () {
        if (!state.isAdminMode) {
          pushToast('Acceso privado deshabilitado');
          return;
        }
        renderAdminItems();

        const idField = document.getElementById('editRecordId');
        if (heading && (!idField || !idField.value)) {
          heading.textContent = 'Agregar nuevo disco';
        }
        window.refreshFormPreview();
        document.getElementById('adminModal')?.classList.add('open');
      };

      window.closeAdminPanel = function () {
        document.getElementById('adminModal')?.classList.remove('open');
      };

      window.resetFormFields = function () {
        document.getElementById('catalogForm')?.reset();
        const idField = document.getElementById('editRecordId');
        const heading = document.getElementById('formHeading');
        if (idField) idField.value = '';
        if (heading) heading.textContent = 'Agregar nuevo disco';
        state.uploadedCoverUrl = '';
        window.refreshFormPreview();
      };

      window.refreshFormPreview = function refreshFormPreview() {
        const preview = document.getElementById('formCoverPreview');
        if (!preview) return;

        if (state.uploadedCoverUrl) {
          preview.src = state.uploadedCoverUrl;
          return;
        }

        const editId = (document.getElementById('editRecordId')?.value || '').trim();
        const album = document.getElementById('albumField')?.value || 'Nuevo LP';
        const artist = document.getElementById('artistField')?.value || 'MANOS SUCIAS';
        const year = document.getElementById('yearField')?.value || '';
        const condition = document.getElementById('conditionField')?.value || 'Nuevo';

        if (editId) {
          const existing = state.records.find((r) => r.id === editId);
          if (existing && existing.cover) {
            preview.src = existing.cover;
            return;
          }
        }

        const matchedCover = getDefaultCoverForAlbum(album);
        if (matchedCover) {
          preview.src = matchedCover;
          return;
        }

        preview.src = buildUniqueSvgCover({
          id: editId || 'draft',
          album,
          artist,
          year: year ? Number(year) : null,
          condition
        });
      };

      window.onCoverUrlInput = function (value) {
        state.uploadedCoverUrl = String(value || '').trim();
        window.refreshFormPreview();
      };

      window.clearCustomCover = function () {
        state.uploadedCoverUrl = '';
        const input = document.getElementById('coverUploadField');
        const urlField = document.getElementById('coverUrlField');
        if (input) input.value = '';
        if (urlField) urlField.value = '';
        const editId = (document.getElementById('editRecordId')?.value || '').trim();
        if (editId) {
          const existing = state.records.find((r) => r.id === editId);
          if (existing) {
            existing.cover = getDefaultCoverForAlbum(existing.album) || buildUniqueSvgCover(existing);
          }
        }
        window.refreshFormPreview();
      };

      window.onCoverFileSelected = function (event) {
        const file = event.target?.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          state.uploadedCoverUrl = String(ev.target?.result || '');
          const urlField = document.getElementById('coverUrlField');
          if (urlField && !state.uploadedCoverUrl.startsWith('data:')) {
            urlField.value = state.uploadedCoverUrl;
          }
          window.refreshFormPreview();
        };
        reader.readAsDataURL(file);
      };

      window.saveRecordFromForm = function (event) {
        event.preventDefault();

        const editId = (document.getElementById('editRecordId')?.value || '').trim();
        const album = (document.getElementById('albumField')?.value || '').trim();
        const artist = (document.getElementById('artistField')?.value || '').trim();
        if (!album || !artist) return;

        const genre = (document.getElementById('genreField')?.value || '').trim();
        const yearRaw = (document.getElementById('yearField')?.value || '').trim();
        const priceRaw = (document.getElementById('priceField')?.value || '').trim();
        const status = document.getElementById('statusField')?.value || 'Disponible';
        const condition = document.getElementById('conditionField')?.value || 'Nuevo';
        const featured = Boolean(document.getElementById('featuredField')?.checked);
        const description = (document.getElementById('descriptionField')?.value || '').trim();
        const tracksRaw = document.getElementById('tracklistField')?.value || '';

        const tracklist = tracksRaw
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter(Boolean);

        const year = yearRaw ? Number(yearRaw) : null;
        const price = priceRaw !== '' && !Number.isNaN(Number(priceRaw)) ? Number(priceRaw) : null;
        const defaultCover = getDefaultCoverForAlbum(album);

        if (editId) {
          const idx = state.records.findIndex((r) => r.id === editId);
          if (idx >= 0) {
            const previousCover = state.records[idx].cover;
            const resolvedCover = state.uploadedCoverUrl || previousCover || defaultCover || buildUniqueSvgCover({
              id: editId,
              album,
              artist,
              year,
              condition
            });
            state.records[idx] = {
              ...state.records[idx],
              album,
              artist,
              genre: genre || state.records[idx].genre || 'Vinilo',
              year,
              price,
              status,
              condition,
              featured,
              cover: resolvedCover,
              description,
              tracklist
            };
            pushToast(`"${album}" actualizado`);
          }
        } else {
          const newId = 'ms-' + Date.now();
          const created = {
            id: newId,
            album,
            artist,
            genre: genre || 'Vinilo',
            year,
            price,
            status,
            condition,
            featured,
            cover: state.uploadedCoverUrl || defaultCover || buildUniqueSvgCover({
              id: newId,
              album,
              artist,
              year,
              condition
            }),
            description: description || 'Agregado al catálogo de MANOS SUCIAS.',
            tracklist
          };
          state.records.unshift(created);
          pushToast(`"${album}" agregado`);
        }

        saveStorage();
        renderCatalogView();
        renderAdminItems();
        window.resetFormFields();
      };

      window.editCatalogRecord = function (id) {
        const rec = state.records.find((r) => r.id === id);
        if (!rec) return;

        window.openAdminPanel();
        const idField = document.getElementById('editRecordId');
        const heading = document.getElementById('formHeading');
        if (idField) idField.value = rec.id;
        if (heading) heading.textContent = `Editando: ${rec.album}`;

        document.getElementById('albumField').value = rec.album || '';
        document.getElementById('artistField').value = rec.artist || '';
        document.getElementById('genreField').value = rec.genre || '';
        document.getElementById('yearField').value = rec.year || '';
        document.getElementById('priceField').value = rec.price !== null && rec.price !== undefined ? rec.price : '';
        document.getElementById('statusField').value = rec.status || 'Disponible';
        document.getElementById('conditionField').value = rec.condition || 'Nuevo';
        document.getElementById('featuredField').checked = Boolean(rec.featured);
        document.getElementById('descriptionField').value = rec.description || '';
        document.getElementById('tracklistField').value = Array.isArray(rec.tracklist) ? rec.tracklist.join('\n') : '';

        const urlField = document.getElementById('coverUrlField');
        if (urlField) {
          urlField.value = rec.cover && !rec.cover.startsWith('data:') ? rec.cover : '';
        }

        state.uploadedCoverUrl = rec.cover && !rec.cover.startsWith('data:') ? rec.cover : '';
        window.refreshFormPreview();
      };

      window.deleteCatalogRecord = function (id) {
        const target = state.records.find((r) => r.id === id);
        state.records = state.records.filter((r) => r.id !== id);
        state.favorites = state.favorites.filter((fid) => fid !== id);
        saveStorage();
        renderCatalogView();
        renderAdminItems();
        pushToast(`"${target ? target.album : 'Disco'}" eliminado`);
      };

      window.resetCatalogToBase = function () {
        state.records = cloneData(BASE_CATALOG);
        state.favorites = [];
        saveStorage();
        window.clearAllFilters();
        renderAdminItems();
        window.resetFormFields();
        pushToast('Catálogo base restablecido');
      };

      window.closeOnBackdrop = function (event, modalId) {
        if (event.target && event.target.id === modalId) {
          document.getElementById(modalId)?.classList.remove('open');
        }
      };

      function pushToast(text) {
        const stack = document.getElementById('toastStack');
        if (!stack) return;
        const el = document.createElement('div');
        el.className = 'toast-card';
        el.textContent = text;
        stack.appendChild(el);
        window.setTimeout(() => {
          el.remove();
        }, 2500);
      }

      function init() {
        try {
          applyAdminVisibility();
          window.addEventListener('hashchange', applyAdminVisibility);
          mountOfficialBrandAssets();
          const loaded = loadStorage();
          state.records = loaded.records;
          state.favorites = loaded.favorites;
          renderCatalogView();
          renderAdminItems();
          window.refreshFormPreview();
        } catch (err) {
          console.error('Error al inicializar la aplicación:', err);
          mountOfficialBrandAssets();
          state.records = cloneData(BASE_CATALOG);
          state.favorites = [];
          renderCatalogView();
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
